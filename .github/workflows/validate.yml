name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  json:
    name: validate-json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-python rather than the runner's system interpreter: hosted images
      # mark that one externally-managed (PEP 668), so `pip install` fails there.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install check dependencies
        run: |
          set -e
          python3 -m pip install --quiet --disable-pip-version-check jsonschema
          # Pinned deliberately, the same way every action above is pinned to a
          # SHA. Bump it on purpose: a newer CLI can add validation rules, and
          # the community-marketplace review pipeline always runs the current
          # one, so a stale pin here can pass while a submission fails.
          npm install -g @anthropic-ai/claude-code@2.1.220
          claude --version

      # Same script you can run locally with ./scripts/validate.sh.
      # STRICT_DEPS=1 turns "dependency missing, check skipped" into a failure,
      # so a broken install step above cannot let this job pass having run
      # nothing.
      - name: Validate
        run: STRICT_DEPS=1 ./scripts/validate.sh
