name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  json:
    name: validate-json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-python rather than the runner's system interpreter: hosted images
      # mark that one externally-managed (PEP 668), so `pip install` fails there.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install check dependencies
        run: |
          set -euo pipefail
          # Hash-pinned. Scorecard's Pinned-Dependencies check treats a pip
          # install as pinned only with --require-hashes, and an npm install
          # as pinned only for `npm ci` (lockfile integrity) or a 40-character
          # git commit. Versions live in the lockfiles:
          #   .github/requirements/validate.txt
          #   .github/ci/package-lock.json
          # Bump Claude Code on purpose: a newer CLI can add validation rules,
          # and the community-marketplace review pipeline always runs the
          # current one, so a stale pin here can pass while a submission fails.
          python3 -m pip install --disable-pip-version-check --require-hashes \
            -r .github/requirements/validate.txt
          npm ci --prefix .github/ci
          echo "$PWD/.github/ci/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$PWD/.github/ci/node_modules/.bin:$PATH"
          claude --version

      # Same script you can run locally with ./scripts/validate.sh.
      # STRICT_DEPS=1 turns "dependency missing, check skipped" into a failure,
      # so a broken install step above cannot let this job pass having run
      # nothing.
      - name: Validate
        run: STRICT_DEPS=1 ./scripts/validate.sh
